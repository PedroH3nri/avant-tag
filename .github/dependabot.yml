version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: pre-develop
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: pre-develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
